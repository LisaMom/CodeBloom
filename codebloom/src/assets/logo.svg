<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bloomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="bloomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flower petals / blooming layers -->
  <g filter="url(#bloomGlow)">
    <circle cx="50" cy="50" r="38" stroke="url(#bloomGrad)" stroke-width="2.5" opacity="0.3" stroke-dasharray="4 4" />
    
    <!-- Blooming Petal Shapes -->
    <path d="M50 18 C58 32, 68 42, 82 50 C68 58, 58 68, 50 82 C42 68, 32 58, 18 50 C32 42, 42 32, 50 18 Z" 
          fill="url(#bloomGrad)" fill-opacity="0.22" stroke="url(#bloomGrad)" stroke-width="2" />
          
    <path d="M50 26 C55 37, 63 45, 74 50 C63 55, 55 63, 50 74 C45 63, 37 55, 26 50 C37 45, 45 37, 50 26 Z" 
          fill="url(#bloomGrad)" fill-opacity="0.35" stroke="url(#bloomGrad)" stroke-width="2" />
  </g>

  <!-- Code Syntax Brackets { } in center -->
  <path d="M43 36 C38 36, 36 38, 36 43 C36 46, 34 48, 30 50 C34 52, 36 54, 36 57 C36 62, 38 64, 43 64" 
        stroke="url(#bracketGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        
  <path d="M57 36 C62 36, 64 38, 64 43 C64 46, 66 48, 70 50 C66 52, 64 54, 64 57 C64 62, 62 64, 57 64" 
        stroke="url(#bracketGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center core seed -->
  <circle cx="50" cy="50" r="4" fill="#10b981" />
</svg>
