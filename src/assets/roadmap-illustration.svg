<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#bgGlow)" />

  <!-- Subtle Grid Lines (Slate 800/700) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
  </g>

  <!-- Glowing Flowing Paths -->
  <path d="M 100 250 C 200 120, 300 380, 420 220 C 520 100, 650 360, 720 240" 
        stroke="url(#pathGradient)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#nodeGlow)" />
  <path d="M 100 250 C 200 120, 300 380, 420 220 C 520 100, 650 360, 720 240" 
        stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Branching path 1 -->
  <path d="M 300 290 C 340 380, 400 400, 480 390" 
        stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" fill="none" opacity="0.7" />

  <!-- Branching path 2 -->
  <path d="M 420 220 C 460 140, 500 110, 580 120" 
        stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 4" fill="none" opacity="0.7" />

  <!-- Milestone Node 1: Foundations -->
  <g transform="translate(100, 250)">
    <circle r="32" fill="#10b981" opacity="0.2" filter="url(#nodeGlow)" />
    <circle r="18" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <path d="M -6 0 L -2 4 L 6 -4" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-65" y="32" width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" />
    <text x="0" y="53" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Google Sans', sans-serif" text-anchor="middle">HTML &amp; CSS Web</text>
  </g>

  <!-- Milestone Node 2: Core JavaScript -->
  <g transform="translate(260, 210)">
    <circle r="36" fill="#34d399" opacity="0.2" filter="url(#nodeGlow)" />
    <circle r="20" fill="#0f172a" stroke="#34d399" stroke-width="3" />
    <text x="0" y="5" fill="#34d399" font-size="13" font-weight="700" font-family="'Google Sans', monospace" text-anchor="middle">JS</text>
    <rect x="-65" y="-56" width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" />
    <text x="0" y="-35" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Google Sans', sans-serif" text-anchor="middle">Modern ES6+ Logic</text>
  </g>

  <!-- Milestone Node 3: React & TypeScript -->
  <g transform="translate(420, 220)">
    <circle r="42" fill="#818cf8" opacity="0.25" filter="url(#nodeGlow)" />
    <circle r="24" fill="#0f172a" stroke="#818cf8" stroke-width="3.5" />
    <!-- React Atom Icon in center -->
    <ellipse rx="15" ry="5" fill="none" stroke="#818cf8" stroke-width="1.8" transform="rotate(30)" />
    <ellipse rx="15" ry="5" fill="none" stroke="#818cf8" stroke-width="1.8" transform="rotate(-30)" />
    <circle r="3" fill="#818cf8" />
    <rect x="-70" y="38" width="140" height="34" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
    <text x="0" y="59" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Google Sans', sans-serif" text-anchor="middle">React &amp; TypeScript</text>
  </g>

  <!-- Milestone Node 4: Backend / APIs -->
  <g transform="translate(560, 190)">
    <circle r="34" fill="#059669" opacity="0.25" filter="url(#nodeGlow)" />
    <circle r="19" fill="#0f172a" stroke="#059669" stroke-width="3" />
    <path d="M -7 -4 L 7 -4 M -7 0 L 7 0 M -7 4 L 7 4" stroke="#059669" stroke-width="2" stroke-linecap="round" />
    <rect x="-65" y="-54" width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#059669" stroke-width="1" />
    <text x="0" y="-33" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'Google Sans', sans-serif" text-anchor="middle">APIs &amp; Database</text>
  </g>

  <!-- Milestone Node 5: Senior Engineer Bloom -->
  <g transform="translate(720, 240)">
    <circle r="44" fill="#eab308" opacity="0.25" filter="url(#nodeGlow)" />
    <circle r="26" fill="#0f172a" stroke="#eab308" stroke-width="3.5" />
    <!-- Trophy / Star Icon -->
    <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,6 -7,10 -5,2 -11,-4 -3,-4" fill="#eab308" />
    <rect x="-70" y="42" width="140" height="34" rx="8" fill="url(#cardGrad)" stroke="#eab308" stroke-width="1" />
    <text x="0" y="63" fill="#fef9c3" font-size="12" font-weight="700" font-family="'Google Sans', sans-serif" text-anchor="middle">Architect Level</text>
  </g>
</svg>
